fy argument"],["Translation","automated as batch","requires adaptation & context","affects final layout","requires choosing register"],["Dashboard","uses data & scripts","sustains interpretation","communicates visually","helps decide what to measure"]] } }

  { id: "prompting-exploratorio", category: "prompting", label: { es: "Prompting exploratorio", en: "Exploratory prompting" },
    desc: { es: "Ocurre cuando el usuario aún no tiene una instrucción cerrada y usa el modelo para pensar, organizar, descubrir o formular mejor el problema.", en: "Happens when the user does not yet have a fully closed instruction and uses the model to think, organize, discover, or formulate the problem better." },
    quickTable: { es: [["Tipo de ficha","Estilo de prompting"],["Necesidad principal","Encontrar estructura sin cierre prematuro"],["Riesgo asociado","Producción prematura, menús genéricos, simplificación, pérdida de intención"],["Criterios relevantes","Tolerancia al contexto, síntesis, memoria, sensibilidad al proceso"]], en: [["File type","Prompting style"],["Main need","Structuring without premature closure"],["Associated risk","Premature production, generic menus, simplification, loss of intention"],["Relevant criteria","Context tolerance, synthesis, memory, process sensitivity"]] },
    refs: { shared: [{ text: "OpenAI. Prompt engineering.", url: "https://developers.openai.com/api/docs/guides/prompt-engineering" }, { text: "Anthropic. Prompt engineering overview.", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview" }, { text: "Google AI. Prompt design strategies.", url: "https://ai.google.dev/gemini-api/docs/prompting-strategies" }] }
  },
  { id: "prompting-dialogico", category: "prompting", label: { es: "Prompting dialógico", en: "Dialogic prompting" },
    desc: { es: "Busca sostener un intercambio donde el modelo no solo responde, sino que contribuye a desarrollar ideas, tensionar argumentos y mantener continuidad conceptual.", en: "Seeks to sustain an exchange where the model not only responds, but contributes to developing ideas, tensioning arguments, and maintaining conceptual continuity." },
    quickTable: { es: [["Tipo de ficha","Estilo de prompting"],["Necesidad principal","Fricción intelectual y colaboración sin apropiación"],["Riesgo asociado","Complacencia, moralización, apropiación del volante, simplificación excesiva"],["Criterios relevantes","Razonamiento, continuidad, crítica, respeto a la intención, precisión conceptual"]], en: [["File type","Prompting style"],["Main need","Intellectual friction and collaboration without appropriation"],["Associated risk","Compliance, moralizing, taking the wheel, excessive simplification"],["Relevant criteria","Reasoning, continuity, critique, respect for intention, conceptual precision"]] },
    refs: { shared: [{ text: "OpenAI. Prompt engineering.", url: "https://developers.openai.com/api/docs/guides/prompt-engineering" }, { text: "Anthropic. Prompt engineering overview.", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview" }, { text: "Google AI. Prompt design strategies.", url: "https://ai.google.dev/gemini-api/docs/prompting-strategies" }] }
  },
  { id: "prompting-orquestador", category: "prompting", label: { es: "Prompting orquestador", en: "Orchestrating prompting" },
    desc: { es: "Coordinación de múltiples operaciones, herramientas o etapas dentro de un mismo flujo de trabajo. El usuario dirige y el modelo ejecuta dentro de un marco estructurado.", en: "Coordination of multiple operations, tools, or stages within a single workflow. The user directs and the model executes within a structured frame." },
    quickTable: { es: [["Tipo de ficha","Estilo de prompting"],["Necesidad principal","Organización modular y preservación de estructura"],["Riesgo asociado","Aplanar el sistema, mezclar etapas, sobreautomatización, pérdida de contexto"],["Criterios relevantes","Arquitectura, memoria, trazabilidad, modularidad, control humano"]], en: [["File type","Prompting style"],["Main need","Modular organization and preservation of structure"],["Associated risk","Flattening the system, mixing stages, over-automation, loss of context"],["Relevant criteria","Architecture, memory, traceability, modularity, human control"]] },
    refs: { shared: [{ text: "OpenAI. Prompt engineering.", url: "https://developers.openai.com/api/docs/guides/prompt-engineering" }, { text: "Anthropic. Prompt engineering overview.", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview" }, { text: "Google AI. Prompt design strategies.", url: "https://ai.google.dev/gemini-api/docs/prompting-strategies" }] }
  },
  { id: "prompting-preservacion-editorial", category: "prompting", label: { es: "Prompting de preservación editorial", en: "Editorial preservation prompting" },
    desc: { es: "Busca auditar, corregir o revisar material sin que el modelo reescriba, normalice o intervenga más allá de lo solicitado. Separa capas de intervención.", en: "Seeks to audit, correct, or review material without the model rewriting, normalizing, or intervening beyond what was requested. Separates intervention layers." },
    quickTable: { es: [["Tipo de ficha","Estilo de prompting"],["Necesidad principal","Control de intervención y separación de capas"],["Riesgo asociado","Blanqueamiento, normalización, sobrecorrección, apropiación del texto"],["Criterios relevantes","Preservación de voz, precisión, separación de capas, alcance de intervención"]], en: [["File type","Prompting style"],["Main need","Control of intervention and separation of layers"],["Associated risk","Whitening, normalization, overcorrection, appropriation of the text"],["Relevant criteria","Voice preservation, precision, separation of layers, scope of intervention"]] },
    refs: { shared: [{ text: "OpenAI. Prompt engineering.", url: "https://developers.openai.com/api/docs/guides/prompt-engineering" }, { text: "Anthropic. Prompt engineering overview.", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview" }, { text: "Google AI. Prompt design strategies.", url: "https://ai.google.dev/gemini-api/docs/prompting-strategies" }], specific: [{ text: "Zhou, N., & Bamman, D. (2025). Culture is Not Trivia: Sociocultural Theory for Cultural NLP. ACL 2025.", url: "https://arxiv.org/abs/2502.12057" }, { text: "Anderson, B. R. et al. (2024). Homogenization Effects of LLMs on Human Creative Ideation.", url: "https://arxiv.org/abs/2402.01536" }, { text: "Wasi, A. T. et al. (2024). LLMs as Writing Assistants: Perspectives on Ownership.", url: "https://arxiv.org/abs/2404.00027" }] }
  },

  // ── DYNAMICS ──
  { id: "dinamica-transaccional", category: "dynamic", label: { es: "Dinámica transaccional", en: "Transactional dynamic" },
    desc: { es: "El usuario formula una solicitud puntual y espera una respuesta directa. El intercambio se parece a una operación concreta: preguntar, recibir, usar o descartar.", en: "The user makes a specific request and expects a direct answer. The exchange resembles a concrete operation: ask, receive, use, or discard." },
    quickTable: { es: [["Tipo de ficha","Dinámica de interacción"],["Necesidad principal","Respuesta directa, clara y usable"],["Qué observar","Si el modelo responde sin exceso de explicación ni desvíos"],["Riesgo asociado","Sobrerrespuesta, vaguedad, formato poco práctico"],["Criterios relevantes","Brevedad, precisión, claridad, formato, velocidad"]], en: [["File type","Interaction dynamic"],["Main need","Direct, clear, usable response"],["What to observe","Whether the model responds without excessive explanation or tangents"],["Associated risk","Over-response, vagueness, impractical format"],["Relevant criteria","Brevity, precision, clarity, format, speed"]] }
  },
  { id: "dinamica-delegativa", category: "dynamic", label: { es: "Dinámica delegativa", en: "Delegative dynamic" },
    desc: { es: "El usuario entrega una tarea al modelo con la expectativa de recibir un resultado completo sin necesidad de supervisión paso a paso.", en: "The user hands a task to the model expecting a complete result without step-by-step supervision." },
    quickTable: { es: [["Tipo de ficha","Dinámica de interacción"],["Necesidad principal","Resultado completo, claro y verificable"],["Riesgo asociado","Sobredelegación, pérdida de agencia, errores plausibles, voz genérica"],["Criterios relevantes","Claridad de instrucción, verificabilidad, riesgo de error, revisión humana"]], en: [["File type","Interaction dynamic"],["Main need","Complete, clear, verifiable output"],["Associated risk","Over-delegation, loss of agency, plausible errors, generic voice"],["Relevant criteria","Instruction clarity, verifiability, risk of error, human review"]] }
  },
  { id: "dinamica-iterativa", category: "dynamic", label: { es: "Dinámica iterativa", en: "Iterative dynamic" },
    desc: { es: "El usuario y el modelo trabajan por rondas sucesivas de ajuste. Cada respuesta se revisa, se corrige y se refina progresivamente.", en: "The user and model work through successive rounds of adjustment. Each response is reviewed, corrected, and progressively refined." },
    quickTable: { es: [["Tipo de ficha","Dinámica de interacción"],["Necesidad principal","Capacidad de ajustar, corregir y preservar dirección"],["Riesgo asociado","Drift, pérdida de instrucciones, ruido acumulado, sobrecorrección"],["Criterios relevantes","Memoria intra-chat, precisión de ajustes, control de cambios, consistencia"]], en: [["File type","Interaction dynamic"],["Main need","Ability to adjust, correct, and preserve direction"],["Associated risk","Drift, loss of instructions, accumulated noise, overcorrection"],["Relevant criteria","Intra-chat memory, precision of adjustments, change control, consistency"]] }
  },
  { id: "dinamica-critica-auditora", category: "dynamic", label: { es: "Dinámica crítica-auditora", en: "Critical-auditing dynamic" },
    desc: { es: "El usuario usa el modelo para revisar, detectar errores, verificar consistencia, comparar versiones o evaluar calidad. La función no es producir sino auditar.", en: "The user uses the model to review, detect errors, verify consistency, compare versions, or evaluate quality. The function is not to produce but to audit." },
    quickTable: { es: [["Tipo de ficha","Dinámica de interacción"],["Necesidad principal","Crítica precisa, útil y limitada al alcance solicitado"],["Riesgo asociado","Moralización, sobrecorrección, falsa equivalencia, blanqueamiento, crítica genérica"],["Criterios relevantes","Precisión, separación de capas, trazabilidad, juicio, respeto al alcance"]], en: [["File type","Interaction dynamic"],["Main need","Precise, useful critique limited to the requested scope"],["Associated risk","Moralizing, overcorrection, false equivalence, whitening, generic critique"],["Relevant criteria","Precision, separation of layers, traceability, judgment, respect for scope"]] },
    refs: { shared: [{ text: "Amershi, S. et al. (2019). Guidelines for Human-AI Interaction. CHI 2019.", url: "https://doi.org/10.1145/3290605.3300233" }, { text: "Schemmer, M. et al. (2023). Appropriate Reliance on AI Advice. IUI 2023.", url: "https://doi.org/10.1145/3581641.3584066" }, { text: "Vasconcelos, H. et al. (2023). Explanations Can Reduce Overreliance. CSCW.", url: "https://doi.org/10.1145/3579605" }, { text: "Liu, J. et al. (2024). SocraticLM. NeurIPS 2024.", url: "https://openreview.net/forum?id=qkoZgJhxsA" }], specific: [{ text: "Kim, S. S. Y. et al. (2025). Fostering Appropriate Reliance on LLMs. CHI 2025.", url: "https://doi.org/10.1145/3706598.3714020" }] }
  },
  { id: "dinamica-dialogica-socratica", category: "dynamic", label: { es: "Dinámica dialógica-socrática", en: "Dialogic-Socratic dynamic" },
    desc: { es: "El modelo funciona como contraparte de pensamiento. El intercambio busca desarrollar ideas, tensionar argumentos, detectar huecos y sostener un proceso de reflexión conjunto.", en: "The model functions as a thinking counterpart. The exchange seeks to develop ideas, tension arguments, detect gaps, and sustain a joint reflection process." },
    quickTable: { es: [["Tipo de ficha","Dinámica de interacción"],["Necesidad principal","Fricción intelectual, preguntas útiles y desarrollo de ideas"],["Riesgo asociado","Complacencia, sobrecorrección, apropiación del marco, moralización, simplificación"],["Criterios relevantes","Razonamiento, continuidad, precisión conceptual, capacidad crítica, respeto a la intención"]], en: [["File type","Interaction dynamic"],["Main need","Intellectual friction, useful questions, and idea development"],["Associated risk","Compliance, overcorrection, appropriation of the frame, moralizing, simplification"],["Relevant criteria","Reasoning, continuity, conceptual precision, critical capacity, respect for intention"]] },
    refs: { shared: [{ text: "Amershi, S. et al. (2019). Guidelines for Human-AI Interaction. CHI 2019.", url: "https://doi.org/10.1145/3290605.3300233" }, { text: "Schemmer, M. et al. (2023). Appropriate Reliance on AI Advice. IUI 2023.", url: "https://doi.org/10.1145/3581641.3584066" }, { text: "Vasconcelos, H. et al. (2023). Explanations Can Reduce Overreliance. CSCW.", url: "https://doi.org/10.1145/3579605" }], specific: [{ text: "Ding, Y. et al. (2024). Boosting LLMs with Socratic Method for Teaching.", url: "https://arxiv.org/abs/2407.17349" }] }
  },
  { id: "dinamica-orquestadora", category: "dynamic", label: { es: "Dinámica orquestadora", en: "Orchestrating dynamic" },
    desc: { es: "El usuario dirige un proceso con múltiples pasos, herramientas o agentes coordinados. El modelo ejecuta dentro de un marco que el usuario estructura y supervisa.", en: "The user directs a process with multiple steps, tools, or coordinated agents. The model executes within a frame that the user structures and supervises." },
    quickTable: { es: [["Tipo de ficha","Dinámica de interacción"],["Necesidad principal","Organización sistémica y respeto por la arquitectura de trabajo"],["Riesgo asociado","Funciones mezcladas, pérdida de arquitectura, pasos genéricos, sobreautomatización"],["Criterios relevantes","Contexto, estructura, memoria, trazabilidad, control humano, modularidad"]], en: [["File type","Interaction dynamic"],["Main need","Systemic organization and respect for work architecture"],["Associated risk","Mixed functions, loss of architecture, generic steps, over-automation"],["Relevant criteria","Context, structure, memory, traceability, human control, modularity"]] }
  },
  { id: "dinamica-relacional-continuidad", category: "dynamic", label: { es: "Dinámica relacional-de continuidad", en: "Relational-continuity dynamic" },
    desc: { es: "El usuario necesita que el modelo mantenga memoria, contexto y criterios a lo largo de múltiples sesiones o intercambios largos.", en: "The user needs the model to maintain memory, context, and criteria across multiple sessions or long exchanges." },
    quickTable: { es: [["Tipo de ficha","Dinámica de interacción"],["Necesidad principal","Estabilidad del marco de interacción y continuidad de criterios"],["Riesgo asociado","Drift, pérdida de contexto, respuestas genéricas, ruptura de protocolo"],["Criterios relevantes","Memoria intra-chat, continuidad, consistencia, sensibilidad al contexto, tolerancia al drift"]], en: [["File type","Interaction dynamic"],["Main need","Stability of the interaction frame and continuity of criteria"],["Associated risk","Drift, loss of context, generic answers, protocol breakdown"],["Relevant criteria","Intra-chat memory, continuity, consistency, context sensitivity, drift tolerance"]] },
    refs: { shared: [{ text: "Amershi, S. et al. (2019). Guidelines for Human-AI Interaction. CHI 2019.", url: "https://doi.org/10.1145/3290605.3300233" }, { text: "Schemmer, M. et al. (2023). Appropriate Reliance on AI Advice. IUI 2023.", url: "https://doi.org/10.1145/3581641.3584066" }, { text: "Vasconcelos, H. et al. (2023). Explanations Can Reduce Overreliance. CSCW.", url: "https://doi.org/10.1145/3579605" }] }
  },

  // ── CONCEPTS ──
  { id: "preservacion-voz", category: "concept", label: { es: "Preservación de voz", en: "Voice preservation" },
    desc: { es: "Capacidad de trabajar con un modelo sin que el texto, tono o postura del usuario sea absorbido en una voz genérica. Incluye la no-normalización editorial.", en: "Ability to work with a model without having the user's text, tone, or stance absorbed into a generic voice. Includes editorial non-normalization." },
    quickTable: { es: [["Tipo de ficha","Concepto pedagógico"],["Necesidad principal","Mantener agencia autoral y textura situada"],["Qué observar","Si el modelo distingue corrección, edición, reescritura, opinión y normalización"],["Riesgo asociado","Blanqueamiento editorial, pérdida de voz, falsa claridad, neutralización cultural"],["Criterios relevantes","Voz, registro, intención, intervención mínima, separación de capas, control autoral"]], en: [["File type","Pedagogical concept"],["Main need","Maintain authorial agency and situated texture"],["What to observe","Whether the model distinguishes correction, editing, rewriting, opinion, and normalization"],["Associated risk","Editorial whitening, loss of voice, false clarity, cultural neutralization"],["Relevant criteria","Voice, register, intention, minimal intervention, separation of layers, authorial control"]] },
    extraTables: { es: { "Señales de alerta": [["Señal","Qué indica"],["El modelo suaviza una frase fuerte sin permiso","Normalización de intensidad"],["Cambia textura bilingüe a español o inglés estándar","Pérdida de textura lingüística"],["Convierte una postura crítica en tono genérico equilibrado","Neutralización editorial"],["Reescribe todo cuando solo se pidió corregir ortografía","Fallo en separar capas de intervención"],["Agrega tono corporativo o académico sin solicitud","Profesionalización no autorizada"],["Cambia humor, ironía o extrañeza a claridad plana","Aplanamiento de voz"]], }, en: { "Warning signs": [["Sign","What it indicates"],["The model softens a strong phrase without permission","Normalization of intensity"],["It changes bilingual texture into standard English or Spanish","Loss of linguistic texture"],["It turns a critical stance into generic balanced tone","Political/editorial neutralization"],["It rewrites everything when asked only to correct spelling","Failure to separate intervention layers"],["It adds corporate or academic tone without request","Unauthorized professionalization"],["It changes humor, irony, or strangeness into flat clarity","Voice flattening"]] } },
    refs: { shared: [{ text: "Zhou, N., & Bamman, D. (2025). Culture is Not Trivia. ACL 2025.", url: "https://arxiv.org/abs/2502.12057" }, { text: "Aksoy, M. (2024). Whose Morality Do They Speak?", url: "https://arxiv.org/abs/2412.18863" }, { text: "Anderson, B. R. et al. (2024). Homogenization Effects of LLMs.", url: "https://arxiv.org/abs/2402.01536" }, { text: "Wasi, A. T. et al. (2024). LLMs as Writing Assistants.", url: "https://arxiv.org/abs/2404.00027" }], specific: [{ text: "Münker, S. (2025). Cultural Bias in LLMs: Evaluating AI Agents through Moral Questionnaires.", url: "https://arxiv.org/abs/2507.10073" }, { text: "Mysore, S. et al. (2025). Prototypical Human-AI Collaboration from LLM-Assisted Writing. EMNLP 2025.", url: "https://aclanthology.org/2025.emnlp-main.852/" }] }
  },
  { id: "drift-tolerancia", category: "concept", label: { es: "Drift y tolerancia al drift", en: "Drift & drift tolerance" },
    desc: { es: "Drift es el movimiento gradual del comportamiento del modelo fuera del marco de trabajo acordado. Puede aparecer como pérdida de instrucciones, cambio de tono, producción prematura o retorno a respuestas genéricas.", en: "Drift is the gradual movement of model behavior away from the agreed work frame. It can appear as loss of instructions, change of tone, premature production, or return to generic answers." },
    quickTable: { es: [["Tipo de ficha","Concepto pedagógico"],["Necesidad principal","Detectar y limitar desviaciones que dañen el flujo de trabajo"],["Riesgo asociado","Ruptura de protocolo, pérdida de voz, errores acumulados, fatiga de reencuadre"],["Criterios relevantes","Estabilidad, memoria intra-chat, seguimiento de restricciones, resistencia a normalización"]], en: [["File type","Pedagogical concept"],["Main need","Detect and limit deviations that damage the workflow"],["Associated risk","Protocol breakdown, loss of voice, cumulative errors, reframing fatigue"],["Relevant criteria","Stability, intra-chat memory, constraint following, resistance to normalization"]] },
    extraTables: { es: { "Tipos frecuentes de drift": [["Tipo","Ejemplo"],["Drift de instrucción","El modelo olvida el formato o restricciones acordadas"],["Drift de tono","Cambia a voz genérica, corporativa, moralizante o demasiado casual"],["Drift editorial","Reescribe o normaliza cuando solo debía corregir o auditar"],["Drift de tarea","Pasa de exploración a producción sin permiso"],["Drift de contexto","Pierde información importante o prioriza información secundaria"],["Drift de falsa seguridad","Evita tareas permitidas por cautela excesiva o sermoneo"],["Drift de confianza","Afirma información con seguridad cuando debería verificar"],["Drift de plataforma","Sobrerepresenta o favorece implícitamente su propio ecosistema"]] }, en: { "Frequent types of drift": [["Type","Example"],["Instruction drift","The model forgets the agreed format or constraints"],["Tone drift","It shifts toward generic, corporate, moralizing, or overly casual voice"],["Editorial drift","It rewrites or normalizes when it was only supposed to correct or audit"],["Task drift","It moves from exploration to production without permission"],["Context drift","It loses important background or prioritizes secondary information"],["False-safety drift","It avoids permitted tasks through excessive caution or lecturing"],["Confidence drift","It states information confidently when it should verify it"],["Platform drift","It implicitly overrepresents or favors its own ecosystem"]] } },
    refs: { shared: [{ text: "Zhou, N., & Bamman, D. (2025). Culture is Not Trivia. ACL 2025.", url: "https://arxiv.org/abs/2502.12057" }, { text: "Aksoy, M. (2024). Whose Morality Do They Speak?", url: "https://arxiv.org/abs/2412.18863" }, { text: "Anderson, B. R. et al. (2024). Homogenization Effects of LLMs.", url: "https://arxiv.org/abs/2402.01536" }, { text: "Wasi, A. T. et al. (2024). LLMs as Writing Assistants.", url: "https://arxiv.org/abs/2404.00027" }] }
  },
  { id: "sparring-partner", category: "concept", label: { es: "Sparring partner como modo de uso", en: "Sparring partner as mode of use" },
    desc: { es: "Usar un modelo como contraparte de pensamiento: no solo para generar respuestas, sino para discutir ideas, detectar huecos, formular objeciones, comparar marcos y tensionar argumentos.", en: "Using a model as a counterpart for thought: not only to generate answers, but to discuss ideas, detect gaps, formulate objections, compare frames, and tension arguments." },
    quickTable: { es: [["Tipo de ficha","Concepto pedagógico"],["Necesidad principal","Fricción intelectual sin pérdida de agencia"],["Qué observar","Si el modelo puede desafiar ideas sin apropiarse del marco ni producir cierre prematuro"],["Riesgo asociado","Complacencia, contradicción vacía, moralización, apropiación del volante, simplificación"]], en: [["File type","Pedagogical concept"],["Main need","Intellectual friction without loss of agency"],["What to observe","Whether the model can challenge ideas without appropriating the frame or producing premature closure"],["Associated risk","Compliance, empty contradiction, moralizing, taking the wheel, simplification"]] },
    extraTables: { es: { "Diferencia con otros modos": [["Modo","Qué hace","Diferencia con sparring"],["Generador","Produce un output solicitado","No necesariamente discute o tensiona la idea"],["Editor","Mejora o modifica un texto","Puede intervenir en forma sin desarrollar pensamiento"],["Tutor","Explica o enseña","Generalmente guía desde un marco pedagógico más estable"],["Asistente operativo","Organiza o ejecuta tareas","Prioriza eficiencia sobre fricción conceptual"],["Auditor","Detecta problemas","Puede revisar sin sostener desarrollo dialógico"],["Sparring partner","Discute, tensiona y ayuda a fortalecer una idea","La fricción es parte del método, no un error de interacción"]] }, en: { "Difference from other modes": [["Mode","What it does","Difference from sparring"],["Generator","Produces a requested output","Does not necessarily discuss or tension the idea"],["Editor","Improves or modifies a text","May intervene on form without developing thought"],["Tutor","Explains or teaches","Usually guides from a more stable pedagogical frame"],["Operational assistant","Organizes or executes tasks","Prioritizes efficiency over conceptual friction"],["Auditor","Detects problems","May review without sustaining dialogic development"],["Sparring partner","Discusses, tensions, and helps strengthen an idea","Friction is part of the method, not an interaction error"]] } },
    refs: { shared: [{ text: "Amershi, S. et al. (2019). Guidelines for Human-AI Interaction. CHI 2019.", url: "https://doi.org/10.1145/3290605.3300233" }, { text: "Schemmer, M. et al. (2023). Appropriate Reliance on AI Advice. IUI 2023.", url: "https://doi.org/10.1145/3581641.3584066" }, { text: "Vasconcelos, H. et al. (2023). Explanations Can Reduce Overreliance. CSCW.", url: "https://doi.org/10.1145/3579605" }, { text: "Liu, J. et al. (2024). SocraticLM. NeurIPS 2024.", url: "https://openreview.net/forum?id=qkoZgJhxsA" }], specific: [{ text: "Mysore, S. et al. (2025). Prototypical Human-AI Collaboration. EMNLP 2025.", url: "https://aclanthology.org/2025.emnlp-main.852/" }, { text: "Kim, S. S. Y. et al. (2025). Fostering Appropriate Reliance on LLMs. CHI 2025.", url: "https://doi.org/10.1145/3706598.3714020" }, { text: "Ding, Y. et al. (2024). Boosting LLMs with Socratic Method.", url: "https://arxiv.org/abs/2407.17349" }, { text: "Laban, P. et al. (2026). LLMs Corrupt Your Documents When You Delegate.", url: "https://arxiv.org/abs/2604.15597" }, { text: "Anthropic. (2025). Effective context engineering for AI agents.", url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents" }] }
  },
  { id: "evaluacion-situada", category: "concept", label: { es: "Evaluación situada de plataformas", en: "Situated platform evaluation" },
    desc: { es: "Un modelo no debe evaluarse solamente por sus capacidades generales, sino por cómo funciona dentro de un contexto concreto de uso.", en: "A model should not be evaluated only by its general capabilities, but by how it functions within a concrete use context." },
    quickTable: { es: [["Tipo de ficha","Marco metodológico"],["Problema que ayuda a resolver","Evitar rankings universales que no consideran el uso real"],["Qué observar","Encaje entre plataforma, usuario, tarea, dinámica, privacidad y resultado esperado"],["Riesgo asociado","Elegir una plataforma porque es 'la mejor' sin saber mejor para qué"]], en: [["File type","Methodological frame"],["Problem it helps solve","Avoid universal rankings that do not consider real use"],["What to observe","Fit between platform, user, task, dynamic, privacy, and expected result"],["Associated risk","Choosing a platform because it is 'the best' without knowing best for what"]] },

// ═══════════════════════════════════════════
// GRAPH ENGINE (same as before, compact)
// ═══════════════════════════════════════════
let currentLang = 'es';
const nodeMap = new Map(NODES.map(n => [n.id, n]));
const validIds = new Set(NODES.map(n => n.id));
const links = LINK_DATA.filter(([s,t]) => validIds.has(s) && validIds.has(t)).map(([source, target]) => ({ source, target }));
const linkSet = new Set(); const dedupedLinks = [];
for (const l of links) { const key = [l.source, l.target].sort().join('||'); if (!linkSet.has(key)) { linkSet.add(key); dedupedLinks.push(l); } }
const nodes = NODES.map(n => ({ ...n }));

const categoryColors = { framework:{fill:'#bc8cff',glow:'rgba(188,140,255,0.5)'}, task:{fill:'#f85149',glow:'rgba(248,81,73,0.5)'}, prompting:{fill:'#58a6ff',glow:'rgba(88,166,255,0.5)'}, dynamic:{fill:'#3fb950',glow:'rgba(63,185,80,0.5)'}, concept:{fill:'#d29922',glow:'rgba(210,153,34,0.5)'}, user:{fill:'#f778ba',glow:'rgba(247,120,186,0.5)'} };
const categoryLabels = { framework:{es:'Marco',en:'Framework'}, task:{es:'Familias de tarea',en:'Task families'}, prompting:{es:'Estilos de prompting',en:'Prompting styles'}, dynamic:{es:'Dinámicas',en:'Dynamics'}, concept:{es:'Conceptos',en:'Concepts'}, user:{es:'Perfiles de usuario',en:'User profiles'} };
const nodeRadius = d => d.category === 'framework' ? 9 : d.category === 'task' ? 7 : 5;

const container = document.getElementById('graph-container');
const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select(container).append('svg').attr('width', width).attr('height', height);
const defs = svg.append('defs');
Object.entries(categoryColors).forEach(([cat, c]) => { const f = defs.append('filter').attr('id', `glow-${cat}`); f.append('feGaussianBlur').attr('stdDeviation', 4).attr('result', 'blur'); f.append('feFlood').attr('flood-color', c.glow).attr('result', 'color'); f.append('feComposite').attr('in', 'color').attr('in2', 'blur').attr('operator', 'in').attr('result', 'cb'); const m = f.append('feMerge'); m.append('feMergeNode').attr('in', 'cb'); m.append('feMergeNode').attr('in', 'SourceGraphic'); });
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.15, 4]).on('zoom', e => g.attr('transform', e.transform)); svg.call(zoom);
const simulation = d3.forceSimulation(nodes).force('link', d3.forceLink(dedupedLinks).id(d => d.id).distance(90).strength(0.25)).force('charge', d3.forceManyBody().strength(-280)).force('center', d3.forceCenter(width/2, height/2)).force('collision', d3.forceCollide().radius(d => nodeRadius(d)+14)).force('x', d3.forceX(width/2).strength(0.03)).force('y', d3.forceY(height/2).strength(0.03));
const link = g.append('g').selectAll('line').data(dedupedLinks).join('line').attr('stroke','rgba(139,148,158,0.15)').attr('stroke-width',0.8);
const nodeGroup = g.append('g'); const node = nodeGroup.selectAll('g').data(nodes).join('g').attr('cursor','pointer').call(d3.drag().on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;}));
node.append('circle').attr('r',nodeRadius).attr('fill',d=>categoryColors[d.category].fill).attr('filter',d=>`url(#glow-${d.category})`).attr('opacity',0.9);
const labels = node.append('text').attr('dx',d=>nodeRadius(d)+4).attr('dy','0.35em').attr('font-size',d=>d.category==='framework'?'9px':'8px').attr('font-family','Inter,sans-serif').attr('font-weight',d=>d.category==='framework'?500:400).attr('fill','rgba(230,237,243,0.7)').attr('pointer-events','none').text(d=>d.label[currentLang]);

const tooltip = document.getElementById('tooltip');
node.on('mouseover', function(event, d) {
  const connected = new Set([d.id]); dedupedLinks.forEach(l => { const s=typeof l.source==='object'?l.source.id:l.source, t=typeof l.target==='object'?l.target.id:l.target; if(s===d.id)connected.add(t); if(t===d.id)connected.add(s); });
  node.select('circle').attr('opacity',n=>connected.has(n.id)?1:0.12); labels.attr('fill',n=>connected.has(n.id)?'rgba(230,237,243,0.9)':'rgba(230,237,243,0.1)');
  link.attr('stroke',l=>{const s=typeof l.source==='object'?l.source.id:l.source,t=typeof l.target==='object'?l.target.id:l.target;return(s===d.id||t===d.id)?'rgba(139,148,158,0.55)':'rgba(139,148,158,0.04)';}).attr('stroke-width',l=>{const s=typeof l.source==='object'?l.source.id:l.source,t=typeof l.target==='object'?l.target.id:l.target;return(s===d.id||t===d.id)?1.5:0.5;});
  tooltip.textContent=d.label[currentLang]; tooltip.classList.add('visible'); tooltip.style.left=(event.clientX+14)+'px'; tooltip.style.top=(event.clientY-10)+'px';
}).on('mousemove',function(event){tooltip.style.left=(event.clientX+14)+'px';tooltip.style.top=(event.clientY-10)+'px';})
.on('mouseout',function(){node.select('circle').attr('opacity',0.9);labels.attr('fill','rgba(230,237,243,0.7)');link.attr('stroke','rgba(139,148,158,0.15)').attr('stroke-width',0.8);tooltip.classList.remove('visible');});

node.on('click', function(event, d) { event.stopPropagation(); openPanel(d); });
svg.on('click', () => closePanel());

// ═══════════════════════════════════════════
// PANEL RENDERING WITH FULL CONTENT
// ═══════════════════════════════════════════
function renderTable(rows) {
  if (!rows || rows.length < 2) return '';
  const [header, ...body] = rows;
  return `<table class="detail-table"><thead><tr>${header.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderRefs(refs) {
  if (!refs) return '';
  let html = '';
  const sharedLabel = currentLang === 'es' ? 'Referencias compartidas' : 'Shared references';
  const specificLabel = currentLang === 'es' ? 'Referencias específicas' : 'Specific references';
  if (refs.shared && refs.shared.length) {
    html += `<div class="ref-group-label">${sharedLabel}</div>`;
    refs.shared.forEach(r => { html += `<div class="ref-item">${r.text}<br><a href="${r.url}" target="_blank" rel="noopener">${r.url}</a></div>`; });
  }
  if (refs.specific && refs.specific.length) {
    html += `<div class="ref-group-label">${specificLabel}</div>`;
    refs.specific.forEach(r => { html += `<div class="ref-item">${r.text}<br><a href="${r.url}" target="_blank" rel="noopener">${r.url}</a></div>`; });
  }
  return html;
}

function openPanel(d) {
  const connections = [];
  dedupedLinks.forEach(l => { const s=typeof l.source==='object'?l.source.id:l.source, t=typeof l.target==='object'?l.target.id:l.target; if(s===d.id&&nodeMap.has(t))connections.push(nodeMap.get(t)); if(t===d.id&&nodeMap.has(s))connections.push(nodeMap.get(s)); });
  const catLabel = categoryLabels[d.category][currentLang];
  const connLabel = currentLang === 'es' ? 'Conexiones' : 'Connections';
  const quickTableLabel = currentLang === 'es' ? 'Ficha rápida' : 'Quick Table';
  const refsLabel = currentLang === 'es' ? 'Referencias públicas' : 'Public References';

  let html = `<span class="detail-category ${d.category}">${catLabel}</span><h2 class="detail-title">${d.label[currentLang]}</h2><p class="detail-description">${d.desc[currentLang]}</p>`;

  // Quick Table
  if (d.quickTable && d.quickTable[currentLang]) {
    html += `<details class="detail-collapsible" open><summary>${quickTableLabel}</summary><div class="inner">`;
    html += `<table class="detail-table"><tbody>${d.quickTable[currentLang].map(([k,v])=>`<tr><td style="width:35%;font-weight:600;color:var(--text)">${k}</td><td>${v}</td></tr>`).join('')}</tbody></table></div></details>`;
  }

  // Extra tables
  if (d.extraTables && d.extraTables[currentLang]) {
    Object.entries(d.extraTables[currentLang]).forEach(([title, rows]) => {
      html += `<details class="detail-collapsible"><summary>${title}</summary><div class="inner">${renderTable(rows)}</div></details>`;
    });
  }

  // Connections
  if (connections.length) {
    html += `<details class="detail-collapsible" open><summary>${connLabel} (${connections.length})</summary><div class="inner"><div class="detail-connections">${connections.map(c=>`<span class="detail-conn-chip" onclick="navigateTo('${c.id}')">${c.label[currentLang]}</span>`).join('')}</div></div></details>`;
  }

  // References
  if (d.refs) {
    const refHtml = renderRefs(d.refs);
    if (refHtml) { html += `<details class="detail-collapsible"><summary>${refsLabel}</summary><div class="inner">${refHtml}</div></details>`; }
  }

  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() { document.getElementById('detail-panel').classList.remove('open'); }
window.navigateTo = function(id) { const n = nodes.find(nd => nd.id === id); if (n) openPanel(n); };

simulation.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
});

// Legend
function renderLegend() {
  const cats = ['framework','task','prompting','dynamic','concept','user'];
  const counts = {}; cats.forEach(c=>counts[c]=nodes.filter(n=>n.category===c).length);
  document.getElementById('legend-items').innerHTML = cats.map(c=>`<div class="legend-item"><span class="legend-dot" style="background:${categoryColors[c].fill};box-shadow:0 0 6px ${categoryColors[c].glow}"></span><span>${categoryLabels[c][currentLang]} (${counts[c]})</span></div>`).join('');
  document.getElementById('legend-label').textContent = currentLang === 'es' ? 'Leyenda' : 'Legend';
}
let legendCollapsed = false;
window.toggleLegend = function() {
  const legend = document.getElementById('legend');
  const btn = document.getElementById('legend-toggle');
  legendCollapsed = !legendCollapsed;
  legend.classList.toggle('collapsed', legendCollapsed);
  btn.textContent = legendCollapsed ? '+' : '−';
  btn.title = legendCollapsed ? (currentLang === 'es' ? 'Expandir' : 'Expand') : (currentLang === 'es' ? 'Minimizar' : 'Minimize');
};
renderLegend();
document.getElementById('node-count').textContent = `${nodes.length} nodos · ${dedupedLinks.length} conexiones`;

// Search
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { node.select('circle').attr('opacity',0.9); labels.attr('fill','rgba(230,237,243,0.7)'); link.attr('stroke','rgba(139,148,158,0.15)').attr('stroke-width',0.8); return; }
  const matches = new Set(); nodes.forEach(n => { if(n.label[currentLang].toLowerCase().includes(q)||n.id.includes(q)) matches.add(n.id); });
  node.select('circle').attr('opacity',n=>matches.has(n.id)?1:0.08); labels.attr('fill',n=>matches.has(n.id)?'#fff':'rgba(230,237,243,0.08)');
  if (matches.size===1) { const mid=[...matches][0]; const conn=new Set([mid]); dedupedLinks.forEach(l=>{const s=typeof l.source==='object'?l.source.id:l.source,t=typeof l.target==='object'?l.target.id:l.target;if(s===mid)conn.add(t);if(t===mid)conn.add(s);}); node.select('circle').attr('opacity',n=>conn.has(n.id)?1:0.08); labels.attr('fill',n=>conn.has(n.id)?'rgba(230,237,243,0.9)':'rgba(230,237,243,0.08)'); link.attr('stroke',l=>{const s=typeof l.source==='object'?l.source.id:l.source,t=typeof l.target==='object'?l.target.id:l.target;return(s===mid||t===mid)?'rgba(139,148,158,0.55)':'rgba(139,148,158,0.03)';}); }
});

// Language toggle
window.setLang = function(lang) {
  currentLang = lang;
  document.getElementById('btn-es').classList.toggle('active', lang==='es');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  labels.text(d => d.label[currentLang]);
  document.getElementById('main-title').textContent = lang==='es' ? 'Mapa de Compatibilidad LLM' : 'LLM Compatibility Map';
  document.getElementById('node-count').textContent = lang==='es' ? `${nodes.length} nodos · ${dedupedLinks.length} conexiones` : `${nodes.length} nodes · ${dedupedLinks.length} connections`;
  searchInput.placeholder = lang==='es' ? 'Buscar nodo...' : 'Search node...';
  renderLegend();
  document.getElementById('instr-title').textContent = lang==='es' ? 'Navegación' : 'Navigation';
  document.getElementById('instr-drag').textContent = lang==='es' ? 'Arrastrar' : 'Drag';
  document.getElementById('instr-click').textContent = lang==='es' ? 'Clic' : 'Click';
  document.documentElement.lang = lang;
};

window.addEventListener('resize', () => { svg.attr('width',window.innerWidth).attr('height',window.innerHeight); simulation.force('center',d3.forceCenter(window.innerWidth/2,window.innerHeight/2)); simulation.alpha(0.1).restart(); });
setTimeout(() => { const p=60; let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity; nodes.forEach(n=>{if(n.x<x0)x0=n.x;if(n.x>x1)x1=n.x;if(n.y<y0)y0=n.y;if(n.y>y1)y1=n.y;}); const dx=x1-x0+p*2,dy=y1-y0+p*2,s=Math.min(width/dx,height/dy,1.2),cx=(x0+x1)/2,cy=(y0+y1)/2; svg.transition().duration(1000).call(zoom.transform,d3.zoomIdentity.translate(width/2,height/2).scale(s).translate(-cx,-cy)); }, 2500);
setTimeout(() => { document.getElementById('instructions').style.opacity='0'; setTimeout(()=>document.getElementById('instructions').style.display='none',600); }, 12000);
</script>
