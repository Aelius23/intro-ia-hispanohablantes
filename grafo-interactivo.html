<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genealogía de la IA · Grafo Interactivo</title>
<meta name="description" content="Grafo interactivo sobre la genealogía de la inteligencia artificial: personas, conceptos, escenarios y puntos de inflexión.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --bg-panel: #161b22;
    --bg-panel-glass: rgba(22, 27, 34, 0.92);
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-muted: #484f58;
    --inflexion: #f85149;
    --inflexion-glow: rgba(248, 81, 73, 0.4);
    --concepto: #58a6ff;
    --concepto-glow: rgba(88, 166, 255, 0.4);
    --persona: #3fb950;
    --persona-glow: rgba(63, 185, 80, 0.4);
    --escenario: #d29922;
    --escenario-glow: rgba(210, 153, 34, 0.4);
    --link-color: rgba(139, 148, 158, 0.18);
    --link-hover: rgba(139, 148, 158, 0.55);
    --accent: #7c3aed;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #graph-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0; left: 0;
  }

  svg { width: 100%; height: 100%; }

  /* ─── Top bar ─── */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: var(--bg-panel-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
  }

  .top-bar h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .top-bar-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .lang-btn {
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .lang-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .node-count {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* ─── Legend ─── */
  .legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: var(--bg-panel-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .legend-item:hover { opacity: 0.8; }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ─── Detail Panel ─── */
  .detail-panel {
    position: fixed;
    top: 48px;
    right: 0;
    width: 380px;
    height: calc(100vh - 48px);
    background: var(--bg-panel-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-left: 1px solid var(--border);
    z-index: 99;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    padding: 24px;
  }

  .detail-panel.open { transform: translateX(0); }

  .detail-panel .close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .detail-panel .close-btn:hover {
    background: var(--border);
    color: var(--text);
  }

  .detail-category {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .detail-category.inflexion { background: var(--inflexion); color: #fff; }
  .detail-category.concepto { background: var(--concepto); color: #0d1117; }
  .detail-category.persona { background: var(--persona); color: #0d1117; }
  .detail-category.escenario { background: var(--escenario); color: #0d1117; }

  .detail-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 16px;
    color: var(--text);
  }

  .detail-description {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .detail-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .detail-connections {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .detail-conn-chip {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .detail-conn-chip:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .detail-sources {
    list-style: none;
  }

  .detail-sources li {
    margin-bottom: 6px;
  }

  .detail-sources a {
    font-size: 11px;
    color: var(--concepto);
    text-decoration: none;
    word-break: break-all;
    transition: color 0.15s;
  }

  .detail-sources a:hover {
    color: var(--text);
    text-decoration: underline;
  }

  /* ─── Search ─── */
  .search-container {
    position: relative;
  }

  .search-input {
    width: 200px;
    padding: 5px 12px 5px 28px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 12px;
    pointer-events: none;
  }

  /* ─── Tooltip ─── */
  .tooltip {
    position: fixed;
    padding: 6px 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 200;
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tooltip.visible { opacity: 1; }

  /* ─── Instructions ─── */
  .instructions {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--bg-panel-glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    z-index: 100;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 220px;
    transition: opacity 0.5s;
  }

  .instructions kbd {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: var(--text-dim);
  }

  /* ─── View toggle ─── */
  .view-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .view-btn {
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .view-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* ─── Timeline ─── */
  #timeline-container {
    width: 100%;
    height: calc(100vh - 48px);
    position: absolute;
    top: 48px;
    left: 0;
    overflow: hidden;
    display: none;
    background: var(--bg);
  }

  #timeline-container.active { display: block; }
  #graph-container.hidden { display: none; }

  #timeline-container svg { width: 100%; height: 100%; }

  /* ─── Timeline Legend ─── */
  .tl-legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: var(--bg-panel-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    z-index: 100;
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .tl-legend.active { display: flex; }

  .tl-legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .tl-legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .tl-scroll-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-panel-glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 11px;
    color: var(--text-muted);
    z-index: 100;
    display: none;
    animation: pulse-hint 2s ease-in-out infinite;
  }

  @keyframes pulse-hint {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  @media (max-width: 768px) {
    .detail-panel { width: 100%; }
    .search-input { width: 120px; }
    .instructions { display: none; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:16px;">
    <h1 id="main-title">Genealogía de la IA</h1>
    <span class="node-count" id="node-count"></span>
  </div>
  <div class="top-bar-controls">
    <div class="view-toggle">
      <button class="view-btn active" id="btn-graph" onclick="setView('graph')">⬡ Grafo</button>
      <button class="view-btn" id="btn-timeline" onclick="setView('timeline')">▸ Línea</button>
    </div>
    <div class="search-container">
      <span class="search-icon">⌕</span>
      <input type="text" class="search-input" id="search" placeholder="Buscar nodo...">
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</div>

<div class="legend" id="legend"></div>

<div class="instructions" id="instructions">
  <strong id="instr-title">Navegación</strong><br>
  <span id="instr-drag">Arrastrar</span>: mover nodos<br>
  <span id="instr-scroll">Scroll</span>: zoom<br>
  <span id="instr-click">Clic</span>: ver ficha<br>
  <span id="instr-hover">Hover</span>: resaltar conexiones
</div>

<div id="graph-container"></div>
<div id="timeline-container"></div>
<div class="tl-scroll-hint" id="scroll-hint">← Arrastra y usa scroll para zoom →</div>

<div class="tl-legend" id="tl-legend">
  <div class="tl-legend-item"><span class="tl-legend-dot" style="background:#f85149"></span><span data-es="Puntos de inflexión" data-en="Inflection points">Puntos de inflexión</span></div>
  <div class="tl-legend-item"><span class="tl-legend-dot" style="background:#3fb950"></span><span data-es="Personas" data-en="People">Personas</span></div>
  <div class="tl-legend-item"><span class="tl-legend-dot" style="background:#58a6ff"></span><span data-es="Conceptos" data-en="Concepts">Conceptos</span></div>
  <div class="tl-legend-item"><span class="tl-legend-dot" style="background:#d29922"></span><span data-es="Escenarios" data-en="Scenarios">Escenarios</span></div>
</div>

<div class="detail-panel" id="detail-panel">
  <button class="close-btn" onclick="closePanel()">×</button>
  <div id="detail-content"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ═══════════════════════════════════════════
// DATA — All 65 nodes from Sandra's vault
// ═══════════════════════════════════════════

const NODES = [
  // ── PUNTOS DE INFLEXIÓN ──
  { id: "1913-markov-cadenas-texto", category: "inflexion",
    label: { es: "1913 · Markov y el texto", en: "1913 · Markov & text" },
    desc: {
      es: "En 1913, Andrey Markov aplicó su trabajo sobre procesos probabilísticos al análisis de Eugene Onegin, de Alexander Pushkin. Tomó una secuencia de miles de letras del poema y las clasificó como vocales o consonantes para estudiar si la aparición de cada elemento era independiente o dependía de lo que venía antes. El resultado mostró que incluso una secuencia escrita podía analizarse como una cadena con regularidades estadísticas.",
      en: "In 1913, Andrey Markov applied his work on probabilistic processes to analyze Eugene Onegin by Alexander Pushkin. He took a sequence of thousands of letters from the poem and classified them as vowels or consonants to study whether each element's appearance was independent or depended on what came before. The result showed that even a written sequence could be analyzed as a chain with statistical regularities."
    }},
  { id: "1943-neurona-logica-mcculloch-pitts", category: "inflexion",
    label: { es: "1943 · Neurona lógica", en: "1943 · Logical neuron" },
    desc: {
      es: "En 1943, McCulloch y Pitts publicaron un modelo formal de neurona artificial capaz de recibir entradas, aplicar una regla lógica y producir una salida binaria. Unieron fisiología, lógica matemática y computación antes de que la inteligencia artificial existiera como campo.",
      en: "In 1943, McCulloch and Pitts published a formal model of an artificial neuron capable of receiving inputs, applying a logical rule, and producing a binary output. They united physiology, mathematical logic, and computation before AI existed as a field."
    }},
  { id: "1948-cibernetica-wiener", category: "inflexion",
    label: { es: "1948 · Cibernética de Wiener", en: "1948 · Wiener's Cybernetics" },
    desc: {
      es: "En 1948, Norbert Wiener publicó Cybernetics, formulando un campo dedicado al estudio del control y la comunicación en animales, máquinas y sistemas organizados. Combinaba matemáticas, ingeniería, fisiología y problemas técnicos de la Segunda Guerra Mundial.",
      en: "In 1948, Norbert Wiener published Cybernetics, establishing a field dedicated to studying control and communication in animals, machines, and organized systems. It combined mathematics, engineering, physiology, and WWII-era technical problems."
    }},
  { id: "1948-teoria-informacion-shannon", category: "inflexion",
    label: { es: "1948 · Teoría de la información", en: "1948 · Information theory" },
    desc: {
      es: "En 1948, Claude Shannon publicó A Mathematical Theory of Communication, formulando una teoría matemática para estudiar cómo se produce, codifica, transmite y recibe información a través de un canal. Permitió pensar la información como magnitud medible y el lenguaje como fuente de señales con regularidades estadísticas.",
      en: "In 1948, Claude Shannon published A Mathematical Theory of Communication, formulating a mathematical theory for studying how information is produced, encoded, transmitted, and received through a channel. It enabled thinking of information as a measurable quantity and language as a source of signals with statistical regularities."
    }},
  { id: "1956-dartmouth-artificial-intelligence", category: "inflexion",
    label: { es: "1956 · Dartmouth: nace la IA", en: "1956 · Dartmouth: AI is born" },
    desc: {
      es: "En 1956 se realizó en Dartmouth College la reunión que agrupó líneas previas bajo una nueva denominación: inteligencia artificial. Organizada por McCarthy, Minsky, Rochester y Shannon, no marca el inicio absoluto de las máquinas, pero sí la institucionalización de un campo con nombre propio.",
      en: "In 1956, a meeting at Dartmouth College grouped previous research lines under a new name: artificial intelligence. Organized by McCarthy, Minsky, Rochester, and Shannon, it marks not the absolute beginning of machines, but the institutionalization of a field with its own name."
    }},
  { id: "1968-gmdh-ivakhnenko-lapa", category: "inflexion",
    label: { es: "1968 · GMDH", en: "1968 · GMDH" },
    desc: {
      es: "En 1968, Alexey Ivakhnenko desarrolló el GMDH (Group Method of Data Handling) en el Instituto de Cibernética de Kyiv. Proponía una forma inductiva de modelar sistemas complejos: partir de datos, generar modelos posibles, evaluarlos y seleccionar estructuras según su desempeño.",
      en: "In 1968, Alexey Ivakhnenko developed GMDH (Group Method of Data Handling) at the Kyiv Institute of Cybernetics. It proposed an inductive way to model complex systems: starting from data, generating possible models, evaluating them, and selecting structures based on performance."
    }},
  { id: "1986-backpropagation", category: "inflexion",
    label: { es: "1986 · Backpropagation", en: "1986 · Backpropagation" },
    desc: {
      es: "En 1986, Rumelhart, Hinton y Williams publicaron un procedimiento de aprendizaje para redes de unidades similares a neuronas, donde los pesos se ajustan para reducir la diferencia entre la salida producida y la esperada. Hizo entrenables redes con capas ocultas.",
      en: "In 1986, Rumelhart, Hinton, and Williams published a learning procedure for networks of neuron-like units, where weights are adjusted to reduce the difference between produced and expected output. It made networks with hidden layers trainable."
    }},
  { id: "2012-alexnet-imagenet-gpu", category: "inflexion",
    label: { es: "2012 · AlexNet e ImageNet", en: "2012 · AlexNet & ImageNet" },
    desc: {
      es: "En 2012, AlexNet usó una red neuronal convolucional profunda entrenada sobre millones de imágenes de ImageNet con aceleración GPU. Demostró que la combinación de grandes datasets, arquitecturas profundas y cómputo paralelo podía superar métodos basados en rasgos diseñados manualmente.",
      en: "In 2012, AlexNet used a deep convolutional neural network trained on millions of ImageNet images with GPU acceleration. It demonstrated that combining large datasets, deep architectures, and parallel computing could surpass methods based on manually designed features."
    }},
  { id: "2014-seq2seq-attention", category: "inflexion",
    label: { es: "2014 · Seq2Seq y atención", en: "2014 · Seq2Seq & attention" },
    desc: {
      es: "En 2014, varios trabajos consolidaron la traducción automática neuronal basada en arquitecturas secuencia-a-secuencia. El mecanismo de atención permitió al decodificador enfocarse en distintas partes de la oración fuente durante la generación.",
      en: "In 2014, several works consolidated neural machine translation based on sequence-to-sequence architectures. The attention mechanism allowed the decoder to focus on different parts of the source sentence during generation."
    }},
  { id: "2017-transformer-attention-is-all-you-need", category: "inflexion",
    label: { es: "2017 · Transformer", en: "2017 · Transformer" },
    desc: {
      es: "En 2017, Vaswani et al. publicaron Attention Is All You Need, presentando el Transformer: una arquitectura basada en mecanismos de atención que desplazó a las redes recurrentes y convolucionales en procesamiento de lenguaje. Umbral técnico hacia GPT, BERT y ChatGPT.",
      en: "In 2017, Vaswani et al. published Attention Is All You Need, presenting the Transformer: an architecture based on attention mechanisms that displaced recurrent and convolutional networks in language processing. Technical threshold toward GPT, BERT, and ChatGPT."
    }},
  { id: "2018-bert-bidirectional-transformers", category: "inflexion",
    label: { es: "2018 · BERT", en: "2018 · BERT" },
    desc: {
      es: "En 2018, BERT usó la arquitectura Transformer para preentrenar representaciones lingüísticas bidireccionales. Consolidó el preentrenamiento sobre grandes corpus como base reutilizable para múltiples tareas de comprensión lingüística.",
      en: "In 2018, BERT used the Transformer architecture to pretrain bidirectional linguistic representations. It consolidated pretraining on large corpora as a reusable base for multiple language understanding tasks."
    }},
  { id: "2018-gpt1-generative-pretraining", category: "inflexion",
    label: { es: "2018 · GPT-1", en: "2018 · GPT-1" },
    desc: {
      es: "En 2018, OpenAI presentó GPT-1, un modelo Transformer entrenado primero con predicción de la siguiente palabra y luego ajustado para tareas específicas. Consolidó el preentrenamiento generativo como ruta práctica para modelos de lenguaje reutilizables.",
      en: "In 2018, OpenAI presented GPT-1, a Transformer model first trained with next-word prediction and then fine-tuned for specific tasks. It consolidated generative pretraining as a practical path for reusable language models."
    }},
  { id: "2020-gpt3-few-shot-learning", category: "inflexion",
    label: { es: "2020 · GPT-3", en: "2020 · GPT-3" },
    desc: {
      es: "En 2020, GPT-3 mostró que un modelo con 175 mil millones de parámetros podía resolver tareas a partir de instrucciones y ejemplos en el prompt, sin fine-tuning específico. Preparó el paso hacia ChatGPT y la capa de producto.",
      en: "In 2020, GPT-3 showed that a model with 175 billion parameters could solve tasks from instructions and examples in the prompt, without specific fine-tuning. It prepared the path toward ChatGPT and the product layer."
    }},
  { id: "2022-anthropic-constitutional-ai", category: "inflexion",
    label: { es: "2022 · Constitutional AI", en: "2022 · Constitutional AI" },
    desc: {
      es: "En 2022, Anthropic publicó Constitutional AI, un método para entrenar asistentes usando principios explícitos como guía de comportamiento. Introdujo una forma importante de entrenar y gobernar asistentes públicos mediante alineamiento explícito.",
      en: "In 2022, Anthropic published Constitutional AI, a method for training assistants using explicit principles as behavioral guides. It introduced an important way to train and govern public assistants through explicit alignment."
    }},
  { id: "2022-chatgpt-product-layer", category: "inflexion",
    label: { es: "2022 · ChatGPT", en: "2022 · ChatGPT" },
    desc: {
      es: "En noviembre de 2022, OpenAI lanzó ChatGPT como interfaz conversacional basada en GPT-3.5. Convirtió una línea técnica previa en una experiencia pública, accesible y dialogada. La novedad no estaba solo en el modelo, sino en la forma de interacción.",

let currentLang = 'es';
const nodeMap = new Map(NODES.map(n => [n.id, n]));
const validIds = new Set(NODES.map(n => n.id));

// Filter links to only valid node pairs
const links = LINK_DATA
  .filter(([s,t]) => validIds.has(s) && validIds.has(t))
  .map(([source, target]) => ({ source, target }));

// Deduplicate links
const linkSet = new Set();
const dedupedLinks = [];
for (const l of links) {
  const key = [l.source, l.target].sort().join('||');
  if (!linkSet.has(key)) {
    linkSet.add(key);
    dedupedLinks.push(l);
  }
}

const nodes = NODES.map(n => ({ ...n }));

const categoryColors = {
  inflexion: { fill: '#f85149', glow: 'rgba(248,81,73,0.5)' },

  escenario: { fill: '#d29922', glow: 'rgba(210,153,34,0.5)' }
};

  concepto:  { es: 'Conceptos', en: 'Concepts' },
  persona:   { es: 'Personas', en: 'People' },

};

const nodeRadius = d => d.category === 'inflexion' ? 8 : 5;

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select(container).append('svg')
  .attr('width', width)
  .attr('height', height);

// Glow filter
const defs = svg.append('defs');
Object.entries(categoryColors).forEach(([cat, colors]) => {
  const filter = defs.append('filter').attr('id', `glow-${cat}`);
  filter.append('feGaussianBlur').attr('stdDeviation', 4).attr('result', 'blur');
  filter.append('feFlood').attr('flood-color', colors.glow).attr('result', 'color');
  filter.append('feComposite').attr('in', 'color').attr('in2', 'blur').attr('operator', 'in').attr('result', 'colorBlur');
  const merge = filter.append('feMerge');
  merge.append('feMergeNode').attr('in', 'colorBlur');
  merge.append('feMergeNode').attr('in', 'SourceGraphic');
});

const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.15, 4])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Simulation
const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(dedupedLinks).id(d => d.id).distance(80).strength(0.3))
  .force('charge', d3.forceManyBody().strength(-200))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 12))
  .force('x', d3.forceX(width / 2).strength(0.03))
  .force('y', d3.forceY(height / 2).strength(0.03));

// Links

  dedupedLinks.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === d.id) connected.add(tid);
    if (tid === d.id) connected.add(sid);
  });
  connected.add(d.id);

  node.select('circle')
    .attr('opacity', n => connected.has(n.id) ? 1 : 0.12);
  labels
    .attr('fill', n => connected.has(n.id) ? 'rgba(230,237,243,0.9)' : 'rgba(230,237,243,0.1)');
  link
    .attr('stroke', l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return (sid === d.id || tid === d.id) ? 'rgba(139,148,158,0.55)' : 'rgba(139,148,158,0.04)';

function openPanel(d) {
  // Find connections
  const connections = [];
  dedupedLinks.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === d.id && nodeMap.has(tid)) connections.push(nodeMap.get(tid));
    if (tid === d.id && nodeMap.has(sid)) connections.push(nodeMap.get(sid));
  });

  const catLabel = categoryLabels[d.category][currentLang];
  const connChips = connections.map(c =>
    `<span class="detail-conn-chip" onclick="navigateTo('${c.id}')">${c.label[currentLang]}</span>`
  ).join('');

  const sectionTitle = {
    connections: { es: 'Conexiones', en: 'Connections' },
  };

  detailContent.innerHTML = `
    <span class="detail-category ${d.category}">${catLabel}</span>
    <h2 class="detail-title">${d.label[currentLang]}</h2>
    <p class="detail-description">${d.desc[currentLang]}</p>
    ${connections.length ? `
      <p class="detail-section-title">${sectionTitle.connections[currentLang]} (${connections.length})</p>
      <div class="detail-connections">${connChips}</div>
    ` : ''}
  `;
  detailPanel.classList.add('open');
}

function closePanel() {
  detailPanel.classList.remove('open');
}

window.navigateTo = function(id) {
  const n = nodeMap.get(id);
  if (n) {
    const nodeData = nodes.find(nd => nd.id === id);
    if (nodeData) openPanel(nodeData);
  }
};

    .attr('y2', d => d.target.y);

});

function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

    link.attr('stroke', 'rgba(139,148,158,0.15)').attr('stroke-width', 0.8);
    return;

  const matches = new Set();
  nodes.forEach(n => {
    if (n.label[currentLang].toLowerCase().includes(q) || n.id.includes(q)) {
      matches.add(n.id);

  node.select('circle').attr('opacity', n => matches.has(n.id) ? 1 : 0.08);
  labels.attr('fill', n => matches.has(n.id) ? '#fff' : 'rgba(230,237,243,0.08)');

  if (matches.size === 1) {
    const matchId = [...matches][0];
    const connected = new Set([matchId]);
    dedupedLinks.forEach(l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      if (sid === matchId) connected.add(tid);
      if (tid === matchId) connected.add(sid);
    });
    node.select('circle').attr('opacity', n => connected.has(n.id) ? 1 : 0.08);
    labels.attr('fill', n => connected.has(n.id) ? 'rgba(230,237,243,0.9)' : 'rgba(230,237,243,0.08)');

      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return (sid === matchId || tid === matchId) ? 'rgba(139,148,158,0.55)' : 'rgba(139,148,158,0.03)';

  nodes.forEach(n => {

    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  });
  const dx = maxX - minX + padding * 2;
  const dy = maxY - minY + padding * 2;
  const scale = Math.min(width / dx, height / dy, 1.2);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const transform = d3.zoomIdentity

let currentView = 'graph';

let tlSvg, tlG, tlZoom;
const expandedEras = new Set();

function extractYear(id) {
  const m = id.match(/^(\d{4})/);
  return m ? parseInt(m[1]) : null;
}

function assignEra(nodeId) {
  const connected = [];
  dedupedLinks.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === nodeId) { const y = extractYear(tid); if (y) connected.push(y); }
    if (tid === nodeId) { const y = extractYear(sid); if (y) connected.push(y); }
  });
  if (connected.length === 0) return 1950;
  return Math.round(connected.reduce((a,b) => a+b, 0) / connected.length);
}

function getConnectedNodes(nodeId) {
  const result = [];
  dedupedLinks.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === nodeId && nodeMap.has(tid)) result.push(nodeMap.get(tid));
    if (tid === nodeId && nodeMap.has(sid)) result.push(nodeMap.get(sid));
  });
  return result;
}

function buildTimeline() {
  const tlContainer = document.getElementById('timeline-container');
  tlContainer.innerHTML = '';
  timelineBuilt = true;

  const W = window.innerWidth;
  const H = window.innerHeight - 48;

  tlSvg = d3.select(tlContainer).append('svg')
    .attr('width', W).attr('height', H);

  tlG = tlSvg.append('g');

  // Year labels group (separate so we can rescale independently)
  const yearLabelsG = tlG.append('g').attr('class', 'year-labels');
  // Bar labels group (inverse-scaled, capped at bar height)
  const barLabelsG = tlG.append('g').attr('class', 'bar-labels');

  // Zoom/pan with dynamic label scaling
  let currentScale = 1;
  tlZoom = d3.zoom()
    .scaleExtent([0.15, 8])
    .on('zoom', e => {
      tlG.attr('transform', e.transform);
      currentScale = e.transform.k;

      // Scale year labels inversely — always render at base size on screen
      yearLabelsG.selectAll('text').each(function() {
        const el = d3.select(this);
        const baseSize = +el.attr('data-base-size');
        const tier = el.attr('data-tier');
        el.attr('font-size', (baseSize / currentScale) + 'px');
      });

      // Scale bar labels inversely, capped at bar screen height
      const trackH = 80, trackGap = 6;
      const barScreenH = trackH * currentScale;
      barLabelsG.selectAll('text').each(function() {
        const el = d3.select(this);
        const baseSize = +el.attr('data-base-size');
        // Cap text at 75% of bar screen height to prevent vertical overlap
        const screenSize = Math.min(baseSize, barScreenH * 0.75);
        el.attr('font-size', (screenSize / currentScale) + 'px');
      });
    });
  tlSvg.call(tlZoom);

  renderPremiere(yearLabelsG, barLabelsG);

  // Initial zoom: show ~50 years centered on 1955
  setTimeout(() => {
    const viewYears = 50;
    const targetScale = W / (viewYears * TL_PX_PER_YEAR);
    const centerYear = 1955;
    const cx = (centerYear - 1900) * TL_PX_PER_YEAR;
    const tx = W / 2 - cx * targetScale;
    tlSvg.call(tlZoom.transform, d3.zoomIdentity.translate(tx, 10).scale(targetScale));
  }, 50);
}

function renderPremiere(yearLabelsG, barLabelsG) {
  tlG.selectAll('.tl-content').remove();
  const contentG = tlG.append('g').attr('class', 'tl-content');

  const minYear = 1900;
  const maxYear = 2027;
  const pxPerYear = TL_PX_PER_YEAR;
  const totalW = (maxYear - minYear) * pxPerYear;

  const trackH = 80;
  const trackGap = 6;
  const rulerH = 90;

  const solidFills = {
    inflexion: { bg: '#5c1a17', hover: '#8b2e28', text: '#ffffff', accent: '#f85149' },
    persona:   { bg: '#143d1e', hover: '#1e5e2d', text: '#ffffff', accent: '#3fb950' },
    concepto:  { bg: '#0f2d4d', hover: '#174878', text: '#ffffff', accent: '#58a6ff' },
    escenario: { bg: '#45340d', hover: '#6b500f', text: '#ffffff', accent: '#d29922' },
  };

  // ── RULER BACKGROUND ──
  contentG.append('rect')
    .attr('x', -500).attr('y', 0)
    .attr('width', totalW + 1000).attr('height', rulerH)
    .attr('fill', '#0d1117');

  // ── RULER TICKS ──
  for (let yr = 1900; yr <= 2025; yr++) {
    const x = (yr - minYear) * pxPerYear;
    const isMajor = yr % 10 === 0;
    const isMid = yr % 5 === 0;

    if (isMajor) {
      contentG.append('line')
        .attr('x1', x).attr('y1', rulerH - 40)
        .attr('x2', x).attr('y2', rulerH)
        .attr('stroke', '#8b949e').attr('stroke-width', 1.5);
    } else if (isMid) {
      contentG.append('line')
        .attr('x1', x).attr('y1', rulerH - 20)
        .attr('x2', x).attr('y2', rulerH)
        .attr('stroke', '#484f58').attr('stroke-width', 1);
    } else {
      contentG.append('line')
        .attr('x1', x).attr('y1', rulerH - 10)
        .attr('x2', x).attr('y2', rulerH)
        .attr('stroke', '#30363d').attr('stroke-width', 0.5);
    }
  }

  contentG.append('line')
    .attr('x1', -500).attr('y1', rulerH)
    .attr('x2', totalW + 500).attr('y2', rulerH)
    .attr('stroke', '#30363d').attr('stroke-width', 1);

  // ── YEAR LABELS (inverse-scaled) ──
  yearLabelsG.selectAll('*').remove();
  for (let yr = 1900; yr <= 2025; yr++) {
    const x = (yr - minYear) * pxPerYear;
    const isMajor = yr % 10 === 0;
    const isMid = yr % 5 === 0;

    if (isMajor) {
      yearLabelsG.append('text')
        .attr('x', x).attr('y', rulerH - 46)
        .attr('text-anchor', 'middle')
        .attr('font-family', 'Inter, Helvetica, Arial, sans-serif')
        .attr('font-size', '28px')
        .attr('data-base-size', 28)
        .attr('data-tier', 'major')
        .attr('font-weight', '700')
        .attr('fill', '#e6edf3')
        .text(yr);
    } else if (isMid) {
      yearLabelsG.append('text')
        .attr('x', x).attr('y', rulerH - 24)
        .attr('text-anchor', 'middle')
        .attr('font-family', 'Inter, Helvetica, Arial, sans-serif')
        .attr('font-size', '13px')
        .attr('data-base-size', 13)
        .attr('data-tier', 'minor')
        .attr('font-weight', '400')
        .attr('fill', '#8b949e')
        .text(yr);
    }
  }

  // ── GRIDLINES ──
  for (let yr = 1900; yr <= 2030; yr += 5) {
    const x = (yr - minYear) * pxPerYear;
    const isMajor = yr % 10 === 0;
    contentG.append('line')
      .attr('x1', x).attr('y1', rulerH)
      .attr('x2', x).attr('y2', 8000)
      .attr('stroke', isMajor ? '#21262d' : '#161b22')
      .attr('stroke-width', isMajor ? 1 : 0.5);
  }

  // ── COLLECT & BIN-PACK ──
  const allBars = nodes.map(n => {
    const span = SPANS[n.id] || [assignEra(n.id), assignEra(n.id) + 5];
    return { node: n, start: span[0], end: span[1] };
  }).sort((a, b) => a.start - b.start || a.end - b.end);

  const lanes = [];
  allBars.forEach(bar => {
    let placed = false;
    for (let i = 0; i < lanes.length; i++) {
      if (bar.start >= lanes[i]) {
        lanes[i] = bar.end;
        bar.lane = i;
        placed = true;
        break;
      }
    }
    if (!placed) {
      bar.lane = lanes.length;
      lanes.push(bar.end);
    }
  });

  // ── DRAW BARS ──

  allBars.forEach(bar => {
    const x1 = (bar.start - minYear) * pxPerYear;
    const x2 = (bar.end - minYear) * pxPerYear;
    const bw = Math.max(x2 - x1, pxPerYear * 2);
    const by = rulerH + 12 + bar.lane * (trackH + trackGap);
    const n = bar.node;
    const fills = solidFills[n.category];

    const barG = contentG.append('g').style('cursor', 'pointer');

    // Solid bar
    barG.append('rect')
      .attr('x', x1).attr('y', by)
      .attr('width', bw).attr('height', trackH)
      .attr('rx', 6)
      .attr('fill', fills.bg);

    // Left accent stripe
    barG.append('rect')
      .attr('x', x1).attr('y', by)
      .attr('width', 6).attr('height', trackH)
      .attr('rx', 3)
      .attr('fill', fills.accent);

    // Clip path for bar label (clips text at bar's right edge)
    const clipId = `cl${n.id.replace(/[^a-z0-9]/gi, '')}`;
    contentG.append('clipPath').attr('id', clipId)
      .append('rect')
      .attr('x', x1).attr('y', by - trackH)
      .attr('width', bw).attr('height', trackH * 3);

    // Label — inverse-scaled, placed in barLabelsG, clipped to bar width
    barLabelsG.append('text')
      .attr('x', x1 + 14)
      .attr('y', by + trackH / 2)
      .attr('dominant-baseline', 'central')
      .attr('font-family', 'Inter, Helvetica, Arial, sans-serif')
      .attr('font-size', '16px')
      .attr('data-base-size', 16)
      .attr('font-weight', '500')
      .attr('fill', '#e6edf3')
      .attr('clip-path', `url(#${clipId})`)
      .attr('pointer-events', 'none')
      .text(n.label[currentLang]);

    // Hover
    barG.on('mouseover', function(event) {
      d3.select(this).selectAll('rect').filter(function(d, i) { return i === 0; }).attr('fill', fills.hover);
      tooltip.textContent = n.label[currentLang];
      tooltip.classList.add('visible');
      tooltip.style.left = (event.clientX + 14) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
    })
    .on('mousemove', function(event) {
      tooltip.style.left = (event.clientX + 14) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
    })
    .on('mouseout', function() {
      d3.select(this).selectAll('rect').filter(function(d, i) { return i === 0; }).attr('fill', fills.bg);
      tooltip.classList.remove('visible');
    });

    barG.on('click', (event) => {
      event.stopPropagation();
      openPanel(n);
    });
  });

  // Raise label groups above content so text paints on top of bars
  yearLabelsG.raise();
  barLabelsG.raise();

  tlSvg.on('click', () => closePanel());
}

// ── View toggle ──
window.setView = function(view) {
  currentView = view;
  document.getElementById('btn-graph').classList.toggle('active', view === 'graph');
  document.getElementById('btn-timeline').classList.toggle('active', view === 'timeline');

  const graphEl = document.getElementById('graph-container');
  const tlEl = document.getElementById('timeline-container');
  const legendEl = document.getElementById('legend');
  const instrEl = document.getElementById('instructions');
  const scrollHint = document.getElementById('scroll-hint');
  const tlLegend = document.getElementById('tl-legend');

  if (view === 'graph') {
    graphEl.classList.remove('hidden');
    tlEl.classList.remove('active');
    legendEl.style.display = '';
    scrollHint.style.display = 'none';
    tlLegend.classList.remove('active');
    simulation.alpha(0.1).restart();
  } else {
    graphEl.classList.add('hidden');
    tlEl.classList.add('active');
    legendEl.style.display = 'none';
    if (instrEl) instrEl.style.display = 'none';
    scrollHint.style.display = 'block';
    tlLegend.classList.add('active');
    // Update legend text for current language
    tlLegend.querySelectorAll('[data-es]').forEach(el => {
      el.textContent = el.getAttribute('data-' + currentLang);
    });
    buildTimeline();
    setTimeout(() => { scrollHint.style.display = 'none'; }, 4000);
  }

  document.getElementById('btn-graph').textContent = currentLang === 'es' ? '⬡ Grafo' : '⬡ Graph';
  document.getElementById('btn-timeline').textContent = currentLang === 'es' ? '▸ Línea' : '▸ Timeline';
};

// Patch setLang for timeline
const origSetLang = window.setLang;
window.setLang = function(lang) {
  origSetLang(lang);
  document.getElementById('btn-graph').textContent = lang === 'es' ? '⬡ Grafo' : '⬡ Graph';
  document.getElementById('btn-timeline').textContent = lang === 'es' ? '▸ Línea' : '▸ Timeline';
  document.getElementById('scroll-hint').textContent = lang === 'es'
    ? '← Arrastra y usa scroll para zoom →'
    : '← Drag and scroll to zoom →';
  if (timelineBuilt) { timelineBuilt = false; buildTimeline(); }
};
